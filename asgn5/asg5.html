<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment 5 - Three.js Scene</title>
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="c" aria-label="Windmill delivery game"></canvas>
    <div id="loading" aria-label="Loading textures">
      <div class="progress"><div class="progressbar"></div></div>
    </div>
    <section class="hud" aria-label="Game status">
      <div class="hud-row">
        <span>Score</span>
        <strong id="score">0/12</strong>
      </div>
      <div class="hud-row">
        <span>Time</span>
        <strong id="timer">60</strong>
      </div>
      <div class="hud-row">
        <span>Mode</span>
        <strong id="mode">Day</strong>
      </div>
      <div class="progress-track" aria-label="Progress to windmill">
        <div id="route-progress"></div>
      </div>
      <p id="message">Use WASD or arrows. Collect wheat, dodge chickens, reach the windmill. Press N for night mode.</p>
    </section>
    <div id="flash-message" aria-live="polite">TRY AGAIN</div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
