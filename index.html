<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE 160</title>
    <style>
        :root {
            --ice: #f8fbff;
            --cyan: #8ff7ff;
            --violet: #c6b4ff;
            --gold: #ffe19a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--ice);
            font-family: Arial, Helvetica, sans-serif;
            background: url("black-hole.webp") center center / cover no-repeat;
        }

        main {
            min-height: 100vh;
            display: block;
            padding: 4vh 1rem 6vh;
            position: relative;
            z-index: 1;
            text-align: center;
        }

        h1 {
            position: fixed;
            top: clamp(1.6rem, 5vh, 3rem);
            left: 50%;
            width: min(94vw, 76rem);
            margin: 0;
            transform: translateX(-50%);
            font-size: clamp(2.7rem, 7.4vw, 6.1rem);
            line-height: 0.88;
            letter-spacing: 0;
            text-transform: uppercase;
            text-shadow:
                0 0 14px rgba(143, 247, 255, 0.9),
                0 0 38px rgba(198, 180, 255, 0.72),
                0 10px 32px rgba(0, 0, 0, 0.8);
        }

        nav {
            width: min(72vw, 15rem);
            position: fixed;
            top: 49%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: settleIn 780ms cubic-bezier(0.2, 0.86, 0.2, 1.12) both;
        }

        .assignments {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.62rem;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .assignments li {
            animation: buttonDrop 640ms cubic-bezier(0.2, 0.86, 0.2, 1.12) both;
        }

        .assignments li:nth-child(1) {
            animation-delay: 80ms;
        }

        .assignments li:nth-child(2) {
            animation-delay: 150ms;
        }

        .assignments li:nth-child(3) {
            animation-delay: 220ms;
        }

        .assignments li:nth-child(4) {
            animation-delay: 290ms;
        }

        .assignments li:nth-child(5) {
            animation-delay: 360ms;
        }

        .assignments li:nth-child(6) {
            animation-delay: 430ms;
        }

        .assignment-link {
            min-height: 3.05rem;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(143, 247, 255, 0.42);
            border-radius: 0.45rem;
            color: var(--ice);
            text-decoration: none;
            font-size: 0.93rem;
            font-weight: 800;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04)),
                rgba(5, 8, 18, 0.72);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 0 18px rgba(143, 247, 255, 0.16);
            transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
        }

        .assignment-link::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 0 28%, rgba(255, 255, 255, 0.34) 42%, transparent 56% 100%);
            transform: translateX(-120%);
            transition: transform 420ms ease;
        }

        .assignment-link:hover,
        .assignment-link:focus-visible {
            transform: translateY(-0.35rem) scale(1.03);
            border-color: rgba(255, 225, 154, 0.9);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 22px rgba(255, 225, 154, 0.36),
                0 0 34px rgba(143, 247, 255, 0.28);
        }

        .assignment-link:hover::before,
        .assignment-link:focus-visible::before {
            transform: translateX(120%);
        }

        .assignment-link:focus-visible {
            outline: 3px solid rgba(143, 247, 255, 0.8);
            outline-offset: 4px;
        }

        @keyframes settleIn {
            from {
                opacity: 0;
                transform: translate(-50%, calc(-50% + 1rem)) scale(0.94);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes buttonDrop {
            from {
                opacity: 0;
                transform: translateY(-0.8rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            body {
                overflow-y: auto;
                background-position: center top;
            }

            main {
                min-height: 100svh;
                padding-block: 3.2rem;
            }

            h1 {
                top: 1.8rem;
                font-size: clamp(2.3rem, 13vw, 4.2rem);
            }

            nav {
                width: min(72vw, 15rem);
                top: 52%;
            }

            .assignments {
                width: 100%;
            }

            .assignment-link {
                min-height: 2.9rem;
                font-size: 0.86rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>CSE 160 Assignments</h1>
        <nav aria-label="Assignment links">
            <ul class="assignments">
                <li><a class="assignment-link" href="asgn0/asg0.html">Assignment 0</a></li>
                <li><a class="assignment-link" href="asgn1/asg1.html">Assignment 1</a></li>
                <li><a class="assignment-link" href="asgn2/asg2.html">Assignment 2</a></li>
                <li><a class="assignment-link" href="asgn3/asg3.html">Assignment 3</a></li>
                <li><a class="assignment-link" href="asgn4/asg4.html">Assignment 4</a></li>
                <li><a class="assignment-link" href="asgn5/asg5.html">Assignment 5</a></li>
            </ul>
        </nav>
    </main>
</body>

</html>
